name: CI Test & Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Client Build
        run: |
          cd client
          npm ci
          npm run build

      - name: Verify Server Syntax
        run: |
          cd server
          npm ci
          node --check index.js
